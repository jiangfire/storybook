name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend Test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOPROXY: "https://goproxy.cn,direct"
      GOSUMDB: "sum.golang.google.cn"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify runner toolchain
        run: bash .gitea/scripts/verify-runner-env.sh

      - name: Run Go tests
        run: go test ./...

  frontend:
    name: Frontend Verify
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOPROXY: "https://goproxy.cn,direct"
      GOSUMDB: "sum.golang.google.cn"
      NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
      npm_config_registry: "https://registry.npmmirror.com"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify runner toolchain
        run: bash .gitea/scripts/verify-runner-env.sh

      - name: Install frontend dependencies
        working-directory: storybook-page
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: storybook-page
        run: pnpm run lint

      - name: Run frontend tests
        working-directory: storybook-page
        run: pnpm run test

      - name: Verify embedded frontend build
        working-directory: storybook-page
        run: pnpm run build:embed

      - name: Verify monolith build
        run: go build -o storybook-server ./cmd/server
