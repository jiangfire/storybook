name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend Test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

  frontend:
    name: Frontend Verify
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        working-directory: storybook-page
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: storybook-page
        run: pnpm run lint

      - name: Type check frontend
        working-directory: storybook-page
        run: pnpm exec tsc --noEmit

      - name: Run frontend tests
        working-directory: storybook-page
        run: pnpm run test

      - name: Verify embedded frontend build
        working-directory: storybook-page
        run: pnpm run build:embed

      - name: Verify monolith build
        run: go build -o storybook-server ./cmd/server
