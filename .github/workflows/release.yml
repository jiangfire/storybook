name: Release Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build Multi-Platform Release Bundles
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        working-directory: storybook-page
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: go test ./...

      - name: Run frontend checks
        working-directory: storybook-page
        run: |
          pnpm run lint
          pnpm run test
          pnpm run build:embed

      - name: Build release bundles
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --always)"
          RELEASE_ROOT="release"

          mkdir -p "${RELEASE_ROOT}"

          build_bundle() {
            local goos="$1"
            local goarch="$2"
            local ext="$3"
            local archive="$4"
            local dir_name="storybook-${VERSION}-${goos}-${goarch}"
            local dist_dir="${RELEASE_ROOT}/${dir_name}"
            local binary_name="storybook-server${ext}"

            rm -rf "${dist_dir}"
            mkdir -p "${dist_dir}"

            GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -o "${dist_dir}/${binary_name}" ./cmd/server
            cp .env.sample "${dist_dir}/.env.sample"
            cp README.md "${dist_dir}/README.md"

            if [[ "${archive}" == "zip" ]]; then
              (
                cd "${RELEASE_ROOT}"
                zip -qr "${dir_name}.zip" "${dir_name}"
              )
            else
              tar -czf "${RELEASE_ROOT}/${dir_name}.tar.gz" -C "${RELEASE_ROOT}" "${dir_name}"
            fi
          }

          build_bundle linux amd64 "" tar.gz
          build_bundle darwin amd64 "" tar.gz
          build_bundle windows amd64 ".exe" zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-release-bundles
          path: |
            release/*.tar.gz
            release/*.zip

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release/*.tar.gz release/*.zip --clobber
          else
            gh release create "${TAG}" release/*.tar.gz release/*.zip \
              --title "${TAG}" \
              --generate-notes
          fi
