name: Release Package

on:
  push:
    tags:
      - "v*"

jobs:
  package:
    name: Build Release Tarball
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: storybook-page/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        working-directory: storybook-page
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: go test ./...

      - name: Run frontend checks
        working-directory: storybook-page
        run: |
          pnpm run lint
          pnpm run test
          pnpm run build:embed

      - name: Build release bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --always)"
          DIST_DIR="release/storybook-${VERSION}-linux-amd64"

          mkdir -p "${DIST_DIR}"
          go build -trimpath -o "${DIST_DIR}/storybook-server" ./cmd/server
          cp .env.sample "${DIST_DIR}/.env.sample"
          cp README.md "${DIST_DIR}/README.md"

          tar -czf "release/storybook-${VERSION}-linux-amd64.tar.gz" -C release "storybook-${VERSION}-linux-amd64"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-release-linux-amd64
          path: release/*.tar.gz
